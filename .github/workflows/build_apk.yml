name: Build and Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    # Bila secret keystore tersedia, APK rilis ditandatangani dengan kunci
    # resmi. Tanpa secret, build tetap berjalan memakai debug key.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Configure Release Signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/wave-music-release.jks
          cat > android/key.properties <<EOF
          storeFile=../wave-music-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Android APK
        run: flutter build apk --release --split-per-abi

      - name: Prepare Release Assets
        run: |
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk WaveMusic-arm64-v8a.apk
          cp app-armeabi-v7a-release.apk WaveMusic-armeabi-v7a.apk
          cp app-x86_64-release.apk WaveMusic-x86_64.apk
          sha256sum WaveMusic-arm64-v8a.apk WaveMusic-armeabi-v7a.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wave-music-apk
          path: |
            build/app/outputs/flutter-apk/WaveMusic-arm64-v8a.apk
            build/app/outputs/flutter-apk/WaveMusic-armeabi-v7a.apk
            build/app/outputs/flutter-apk/WaveMusic-x86_64.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Wave Music ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            build/app/outputs/flutter-apk/WaveMusic-arm64-v8a.apk
            build/app/outputs/flutter-apk/WaveMusic-armeabi-v7a.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          generate_release_notes: true
