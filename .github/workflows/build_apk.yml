name: Build and Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Default hanya baca. Hanya job rilis yang mendapat izin menulis.
permissions:
  contents: read

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Bila secret keystore tersedia, APK rilis ditandatangani dengan kunci
    # resmi. Tanpa secret, build tetap berjalan memakai debug key untuk
    # pengujian, tetapi tag rilis akan ditolak oleh langkah validasi.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Release Signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Tag rilis membutuhkan secret ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Configure Release Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Keystore rilis tidak tersedia; build ini memakai debug key."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/wave-music-release.jks
          cat > android/key.properties <<EOF
          storeFile=../wave-music-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Android APK
        run: flutter build apk --release --split-per-abi

      - name: Verify APK Signatures
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner tidak ditemukan di Android SDK."
            exit 1
          fi
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "Memeriksa signature $apk"
            "$APKSIGNER" verify --print-certs "$apk"
            if [[ "$GITHUB_REF" == refs/tags/v* ]] && \
               "$APKSIGNER" verify --print-certs "$apk" | grep -q "CN=Android Debug"; then
              echo "::error::$apk ditandatangani dengan debug key dan tidak boleh dirilis."
              exit 1
            fi
          done

      - name: Prepare Release Assets
        run: |
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk WaveMusic-arm64-v8a.apk
          cp app-armeabi-v7a-release.apk WaveMusic-armeabi-v7a.apk
          cp app-x86_64-release.apk WaveMusic-x86_64.apk
          sha256sum WaveMusic-arm64-v8a.apk WaveMusic-armeabi-v7a.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wave-music-apk
          path: |
            build/app/outputs/flutter-apk/WaveMusic-arm64-v8a.apk
            build/app/outputs/flutter-apk/WaveMusic-armeabi-v7a.apk
            build/app/outputs/flutter-apk/WaveMusic-x86_64.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: wave-music-apk
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Wave Music ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/WaveMusic-arm64-v8a.apk
            release-assets/WaveMusic-armeabi-v7a.apk
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
