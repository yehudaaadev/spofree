name: Build and Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release --split-per-abi

      - name: Prepare Release Assets
        run: |
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk WaveMusic-arm64-v8a.apk
          cp app-armeabi-v7a-release.apk WaveMusic-armeabi-v7a.apk
          cp app-x86_64-release.apk WaveMusic-x86_64.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wave-music-apk
          path: |
            build/app/outputs/flutter-apk/WaveMusic-arm64-v8a.apk
            build/app/outputs/flutter-apk/WaveMusic-armeabi-v7a.apk
            build/app/outputs/flutter-apk/WaveMusic-x86_64.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Wave Music ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            build/app/outputs/flutter-apk/WaveMusic-arm64-v8a.apk
            build/app/outputs/flutter-apk/WaveMusic-armeabi-v7a.apk
          generate_release_notes: true
