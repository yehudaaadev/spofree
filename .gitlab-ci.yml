stages:
  - verify

flutter:
  stage: verify
  # Disamakan dengan versi Flutter di GitHub Actions agar hasil analyze sama.
  image: ghcr.io/cirruslabs/flutter:3.47.7
  timeout: 30m
  cache:
    key: flutter-pub-$CI_COMMIT_REF_SLUG
    paths:
      - .dart_tool/
      - pubspec.lock
  script:
    - flutter config --no-analytics
    - flutter pub get
    - flutter analyze
    - flutter test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
